<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四種武器使用時機決策表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: transparent;
    --card: #ffffff;
    --row-alt: #f7f3ed;
    --text: #1a1a1a;
    --text-secondary: #5c5c5c;
    --border: #e8e4df;
    --head-bg: #2b2b2b;
    --head-text: #ffffff;
    --shadow: 0 4px 18px rgba(0,0,0,0.06);
    /* 四種武器代表色 */
    --connector: #e8830c;
    --project: #1f6feb;
    --skill: #8957e5;
    --cowork: #1a9c5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #1f1d1b;
      --row-alt: #26241f;
      --text: #f0ece6;
      --text-secondary: #b3ada4;
      --border: #38342e;
      --head-bg: #111110;
      --head-text: #f0ece6;
      --shadow: 0 4px 18px rgba(0,0,0,0.35);
      --connector: #f0a04b;
      --project: #6ea8ff;
      --skill: #b18cf2;
      --cowork: #4fc98a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4px;
    background: var(--bg);
    font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
    color: var(--text);
  }
  .wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  thead th {
    background: var(--head-bg);
    color: var(--head-text);
    font-weight: 700;
    text-align: left;
    padding: 14px 18px;
    letter-spacing: .02em;
  }
  tbody td {
    padding: 16px 18px;
    border-top: 1px solid var(--border);
    vertical-align: middle;
    line-height: 1.6;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  .want { font-weight: 600; }
  .essence { color: var(--text-secondary); }
  /* 武器標籤膠囊 */
  .pill {
    display: inline-block;
    font-weight: 700;
    font-size: 14px;
    padding: 5px 14px;
    border-radius: 999px;
    white-space: nowrap;
    color: #fff;
  }
  .pill.connector { background: var(--connector); }
  .pill.project   { background: var(--project); }
  .pill.skill     { background: var(--skill); }
  .pill.cowork    { background: var(--cowork); }
  /* 響應式：窄螢幕改為卡片堆疊 */
  @media (max-width: 640px) {
    thead { display: none; }
    tbody td { display: block; border-top: none; padding: 4px 18px; }
    tbody tr { display: block; border-top: 1px solid var(--border); padding: 14px 0; }
    tbody tr:first-child { border-top: none; }
    .want { font-size: 16px; padding-top: 12px; }
    .pill-cell { padding-top: 10px; padding-bottom: 6px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>你想做的事</th>
          <th>該用</th>
          <th>一句話本質</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="want">讓 AI 讀我的 Gmail / 行事曆 / Notion</td>
          <td class="pill-cell"><span class="pill connector">Connector</span></td>
          <td class="essence">給它「眼睛跟手」去碰你的工具</td>
        </tr>
        <tr>
          <td class="want">不想每次重講背景、品牌、語氣</td>
          <td class="pill-cell"><span class="pill project">Project</span></td>
          <td class="essence">給它「長期記憶」與身分設定</td>
        </tr>
        <tr>
          <td class="want">把一套有效流程變成一鍵重複</td>
          <td class="pill-cell"><span class="pill skill">Skill</span></td>
          <td class="essence">給它「SOP 手冊」照步驟做</td>
        </tr>
        <tr>
          <td class="want">讓它真的去整理檔案、產出成品</td>
          <td class="pill-cell"><span class="pill cowork">Cowork</span></td>
          <td class="essence">給它「工作桌」自己動手</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
