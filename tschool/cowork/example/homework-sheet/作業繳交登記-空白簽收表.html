<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業繳交登記（空白簽收表）</title>
<style>
  @page { size: A4; margin: 18mm; }
  body { font-family: "Microsoft JhengHei", "Heiti TC", "Noto Sans TC", sans-serif; color: #000; background: #fff; margin: 24px; }
  h1 { font-size: 26px; text-align: center; margin: 0 0 6px; }
  .note { font-size: 13px; text-align: center; margin: 0 0 18px; }
  .meta { font-size: 18px; margin: 0 0 14px; display: flex; gap: 32px; }
  .meta span { flex: 1; border-bottom: 1px solid #000; padding-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1.5px solid #000; font-size: 18px; height: 56px; text-align: center; }
  th { background: #eee; height: 44px; }
  th small { font-weight: normal; font-size: 13px; }
  .foot { font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <h1>數學作業繳交登記</h1>
  <p class="note">課堂練習用｜請填虛構資料，只寫座號，不寫學生姓名</p>
  <p class="meta"><span>作業名稱：</span><span>登記日期：</span></p>
  <table>
    <thead>
      <tr>
        <th style="width:22%">座號</th>
        <th style="width:39%">繳交日期</th>
        <th style="width:39%">狀態<br><small>已繳／未繳／補交</small></th>
      </tr>
    </thead>
    <tbody>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td></tr>
    </tbody>
  </table>
  <p class="foot">用法：列印 3 張，每張手寫 5 列左右（座號不要重複），用手機各拍一張。</p>
</body>
</html>
